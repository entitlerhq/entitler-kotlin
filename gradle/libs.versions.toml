[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.5.0"
junit = "6.1.3"
ktlint = "1.8.0"
detekt = "1.23.8"
ktor = "3.5.2"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
android-signature = { module = "com.toasttab.android:gummy-bears-api-21", version = "0.16.0" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version = "2.2.0" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version = "2.2.0" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.11" }
binary-compatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.1" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version = "2.0.1" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.2.0" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
