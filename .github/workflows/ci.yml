name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew ktlintCheck detekt

  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, java: '17' }
          - { os: ubuntu-24.04, java: '21' }
          - { os: ubuntu-24.04, java: '25' }
          - { os: macos-15, java: '25' }
          - { os: windows-2025, java: '25' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, test, check coverage, the API dump and the Android API level
        shell: bash
        run: ./gradlew :entitler:build :entitler-generator:build koverVerify apiCheck animalsnifferMain

  docs:
    name: API reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew dokkaGenerate

  examples:
    name: Examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the examples and check every documentation snippet
        run: ./gradlew :examples:build

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the artefacts Maven Central would receive
        run: ./gradlew publishToMavenLocal
      - name: Check the artefacts and report their size
        run: |
          {
            echo "| Artefact | Size (bytes) |"
            echo "| --- | --- |"
            for file in ~/.m2/repository/com/entitlerhq/*/*/*.jar ~/.m2/repository/com/entitlerhq/*/*/*.pom; do
              test -s "$file"
              echo "| $(basename "$file") | $(wc -c < "$file") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          unzip -l ~/.m2/repository/com/entitlerhq/entitler/*/entitler-*[0-9].jar | grep -q 'com/entitlerhq/entitler/EntitlerServer.class'
          if unzip -l ~/.m2/repository/com/entitlerhq/entitler/*/entitler-*[0-9].jar | grep -qE 'Test|fixtures|examples'; then
            echo "The library artefact holds files that are not the library."
            exit 1
          fi
          java -jar ~/.m2/repository/com/entitlerhq/entitler-generator/*/entitler-generator-*-all.jar --help

  integration:
    name: Integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Run the live API tests and the quick start
        env:
          ENTITLER_TEST_KEY: ${{ secrets.ENTITLER_TEST_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$ENTITLER_TEST_KEY" ]; then
            if [ "$EVENT" = pull_request ] && { [ "$HEAD_REPO" != "$REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; }; then
              echo "Live API tests skipped: this pull request has no access to ENTITLER_TEST_KEY."
              exit 0
            fi
            echo "ENTITLER_TEST_KEY is not set."
            exit 1
          fi
          ./gradlew :entitler:integrationTest
          ENTITLER_KEY="$ENTITLER_TEST_KEY" ./gradlew :examples:quickstart
      - name: Report a failed nightly run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly live API tests failed"
          number=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$REPO" --title "$title" --body "The nightly live API tests failed: $RUN_URL"
          fi

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, test, docs, examples, package, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job finished with $result."
              exit 1
            fi
          done
